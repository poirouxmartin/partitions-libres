org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# ABIs built for libverovio: arm64-v8a = phones, x86_64 = emulator.
# Faster emulator-only local build: -PvrvAbis=x86_64 (never for a published APK).
vrvAbis=arm64-v8a,x86_64
